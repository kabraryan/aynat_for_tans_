services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: aynat
      POSTGRES_PASSWORD: aynat
      POSTGRES_DB: aynat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aynat -d aynat"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
